<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#050a14"/>
    </linearGradient>
    <linearGradient id="phoneB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="screenB1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="screenB2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="screenB3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="frameB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#bgB)"/>

  <!-- Rack-Frame (offene Konstruktion, nur Eckpfosten) -->
  <g transform="translate(256, 256)">
    <!-- Vier vertikale Pfosten (Rack-Style) -->
    <rect x="-150" y="-170" width="10" height="340" rx="2" fill="url(#frameB)"/>
    <rect x="140"  y="-170" width="10" height="340" rx="2" fill="url(#frameB)"/>

    <!-- Top + Bottom Crossbeams -->
    <rect x="-160" y="-180" width="320" height="14" rx="3" fill="url(#frameB)"/>
    <rect x="-160" y="166"  width="320" height="14" rx="3" fill="url(#frameB)"/>

    <!-- Status-LEDs am Frame oben -->
    <circle cx="-130" cy="-173" r="3" fill="#22c55e"/>
    <circle cx="-115" cy="-173" r="3" fill="#22c55e"/>
    <circle cx="-100" cy="-173" r="3" fill="#fbbf24"/>

    <!-- Phones gestapelt, horizontal liegend (wie Server-Blades) -->
    <!-- Phone 1 (oben) -->
    <g transform="translate(-130, -140)">
      <rect x="0" y="0" width="260" height="80" rx="10" fill="url(#phoneB)" stroke="#334155" stroke-width="1.5"/>
      <rect x="10" y="10" width="180" height="60" rx="4" fill="url(#screenB1)"/>
      <!-- Display-Indikatoren (Code/Activity) -->
      <rect x="20" y="20" width="60" height="4" rx="2" fill="#fff" opacity="0.9"/>
      <rect x="20" y="30" width="80" height="4" rx="2" fill="#fff" opacity="0.6"/>
      <rect x="20" y="40" width="50" height="4" rx="2" fill="#fff" opacity="0.9"/>
      <rect x="20" y="50" width="70" height="4" rx="2" fill="#fff" opacity="0.6"/>
      <!-- Power-Button rechts -->
      <circle cx="220" cy="40" r="6" fill="#22c55e"/>
      <circle cx="220" cy="40" r="10" fill="#22c55e" opacity="0.25"/>
      <!-- Side detail -->
      <rect x="240" y="25" width="14" height="30" rx="2" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    </g>

    <!-- Phone 2 (mitte) - aktiv, leicht hervorgehoben -->
    <g transform="translate(-130, -40)">
      <rect x="0" y="0" width="260" height="80" rx="10" fill="url(#phoneB)" stroke="#3b82f6" stroke-width="2"/>
      <rect x="10" y="10" width="180" height="60" rx="4" fill="url(#screenB2)"/>
      <!-- Aktiveres Display: kleines App-Grid -->
      <rect x="20" y="18" width="14" height="14" rx="3" fill="#fff" opacity="0.95"/>
      <rect x="40" y="18" width="14" height="14" rx="3" fill="#fbbf24"/>
      <rect x="60" y="18" width="14" height="14" rx="3" fill="#34d399"/>
      <rect x="80" y="18" width="14" height="14" rx="3" fill="#f472b6"/>
      <rect x="20" y="38" width="14" height="14" rx="3" fill="#a78bfa"/>
      <rect x="40" y="38" width="14" height="14" rx="3" fill="#fb7185"/>
      <rect x="60" y="38" width="14" height="14" rx="3" fill="#22d3ee"/>
      <rect x="80" y="38" width="14" height="14" rx="3" fill="#fff" opacity="0.6"/>
      <!-- Code-Andeutung -->
      <rect x="110" y="22" width="70" height="3" rx="1.5" fill="#fff" opacity="0.7"/>
      <rect x="110" y="30" width="55" height="3" rx="1.5" fill="#fff" opacity="0.5"/>
      <rect x="110" y="38" width="65" height="3" rx="1.5" fill="#fff" opacity="0.7"/>
      <rect x="110" y="46" width="40" height="3" rx="1.5" fill="#fff" opacity="0.5"/>
      <rect x="110" y="54" width="60" height="3" rx="1.5" fill="#fff" opacity="0.7"/>
      <!-- Power -->
      <circle cx="220" cy="40" r="6" fill="#22c55e"/>
      <circle cx="220" cy="40" r="10" fill="#22c55e" opacity="0.4"/>
      <rect x="240" y="25" width="14" height="30" rx="2" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
    </g>

    <!-- Phone 3 (unten) -->
    <g transform="translate(-130, 60)">
      <rect x="0" y="0" width="260" height="80" rx="10" fill="url(#phoneB)" stroke="#334155" stroke-width="1.5"/>
      <rect x="10" y="10" width="180" height="60" rx="4" fill="url(#screenB3)" opacity="0.85"/>
      <rect x="20" y="20" width="70" height="4" rx="2" fill="#fff" opacity="0.9"/>
      <rect x="20" y="30" width="50" height="4" rx="2" fill="#fff" opacity="0.6"/>
      <rect x="20" y="40" width="80" height="4" rx="2" fill="#fff" opacity="0.9"/>
      <rect x="20" y="50" width="60" height="4" rx="2" fill="#fff" opacity="0.6"/>
      <circle cx="220" cy="40" r="6" fill="#64748b"/>
      <rect x="240" y="25" width="14" height="30" rx="2" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    </g>
  </g>
</svg>
